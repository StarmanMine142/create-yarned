    accessWidenerPath = file("src/main/resources/create.accesswidener")

    runs {
        client {
            client()
            setConfigName("Client")
            ideConfigGenerated = true
            runDir = "run"
        }

        server {
            server()
            setConfigName("Server")
            ideConfigGenerated = true
            runDir = "run/server"
        }
